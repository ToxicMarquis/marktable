<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица на весь экран</title>
    <style>
        /* Стили для всей страницы */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Убираем полосы прокрутки */
        }

        /* Стили для таблицы */
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse; /* Убираем отступы между ячейками */
            table-layout: fixed; /* Фиксированная ширина колонок */
        }

        /* Стили для ячеек таблицы */
        th, td {
            border: 1px solid #000; /* Границы ячеек */
            text-align: center; /* Выравнивание текста по центру */
            padding: 10px;
            font-size: 16px;
            word-wrap: break-word; /* Перенос текста, если он не помещается */
        }

        /* Заголовки таблицы */
        th {
            background-color: #f4f4f4;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <iframe title="marks beta" width="600" height="373.5" src="https://app.powerbi.com/view?r=eyJrIjoiZTM4ZDVjZDYtZTFiYi00ODdhLWFiMmQtYzAyYzZkYTk4NTA1IiwidCI6Ijk1MjM5OWRkLTQ4MDgtNGNiNi05MWRjLTE4YjM0NmE4MzA5NCJ9" frameborder="0" allowFullScreen="true"></iframe>

    <table>
        <thead>
            <tr>
                <th>Заголовок 1</th>
                <th>Заголовок 2</th>
                <th>Заголовок 3</th>
                <th>Заголовок 4</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Данные 1</td>
                <td>Данные 2</td>
                <td>Данные 3</td>
                <td>Данные 4</td>
            </tr>
            <tr>
                <td>Данные 5</td>
                <td>Данные 6</td>
                <td>Данные 7</td>
                <td>Данные 8</td>
            </tr>
            <tr>
                <td>Данные 9</td>
                <td>Данные 10</td>
                <td>Данные 11</td>
                <td>Данные 12</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
